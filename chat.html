<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat Room</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 20px; background: #f7f9fb; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .post-form { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px #ccc; margin-bottom: 20px; }
    textarea { width: 100%; height: 60px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; resize: none; }
    button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .chat-box { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px #ddd; }
    .chat-box img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
    .chat-header { font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>

<div class="header">
  <h2>🌐 Chat Wall</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="post-form">
  <textarea id="postText" placeholder="Share something..."></textarea>
  <button onclick="submitPost()">📯 Post</button>
</div>

<div id="chatArea"></div>

<script>
  const user = localStorage.getItem('currentUser');
  const profile = JSON.parse(localStorage.getItem(`profile_${user}`));
  if (!profile) location.href = 'profile.html';

  const chatArea = document.getElementById("chatArea");

  function submitPost() {
    const text = document.getElementById("postText").value.trim();
    if (!text) return alert("Write something first!");
    const post = { user: profile.name, avatar: profile.img, text, time: new Date().toLocaleString() };

    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    posts.push(post);
    localStorage.setItem('posts', JSON.stringify(posts));
    document.getElementById("postText").value = '';
    displayPosts();
  }

  function displayPosts() {
    const posts = JSON.parse(localStorage.getItem('posts') || '[]').reverse();
    chatArea.innerHTML = '';
    posts.forEach(post => {
      chatArea.innerHTML += `
        <div class="chat-box">
          <div class="chat-header">
            <img src="${post.avatar}" alt="avatar" />
            ${post.user} <span style="font-size: 12px; color: gray;">(${post.time})</span>
          </div>
          <div class="chat-text">${post.text}</div>
        </div>
      `;
    });
  }

  function logout() {
    localStorage.removeItem('currentUser');
    location.href = 'index.html';
  }

  displayPosts();
</script>

</body>
</html>
