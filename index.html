<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | My Chat App</title>
  <style>
    body { font-family: Arial; background: #eef; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: white; padding: 30px; border-radius: 10px; width: 300px; text-align: center; box-shadow: 0 0 10px #999; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 10px; width: 100%; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login / Register</h2>
    <input id="username" placeholder="Enter username" />
    <button onclick="login()">Continue</button>
  </div>

  <script>
    function login() {
      const username = document.getElementById('username').value.trim();
      if (!username) return alert("Enter a valid name");
      localStorage.setItem('currentUser', username);
      location.href = 'profile.html';
    }
  </script>
</body>
</html>
